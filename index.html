<!DOCTYPE html>
<html lang="en" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MYG Overseas Trip Planner - Login</title>
<link rel="manifest" href="manifest.json">
<!-- [CONSIDERATION - UI/UX]: Load Tailwind via CDN and apply custom config (Black-based Dark Mode) -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="frontend/js/tailwind.config.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="frontend/css/styles.css">
</head>
<body class="bg-zinc-50 dark:bg-black text-zinc-900 dark:text-zinc-100 h-[100dvh] w-full flex flex-col overflow-y-auto overflow-x-hidden selection:bg-primary selection:text-white transition-colors duration-200 pb-safe">

<header class="sticky top-0 z-50 shadow-lg shrink-0 bg-white dark:bg-zinc-900">
  <nav class="bg-white/90 dark:bg-zinc-900/90 backdrop-blur-md border-b border-zinc-200 dark:border-zinc-800 py-3 flex flex-col justify-center">
    <div class="container mx-auto px-4 flex items-center justify-between w-full min-h-[32px] gap-2">
      <div class="flex items-center gap-2 cursor-pointer shrink-0">
          <div class="bg-primary p-2 rounded-lg shadow-lg shadow-blue-500/20 flex items-center justify-center">
              <i class="fa-solid fa-plane-departure text-white text-lg"></i>
          </div>
          <div class="flex flex-col justify-center">
              <h1 class="text-lg md:text-xl font-black text-zinc-900 dark:text-white leading-none mb-0.5 tracking-tight">Trip Planner</h1>
              <p class="text-[10px] md:text-xs font-bold text-zinc-500 dark:text-zinc-400 leading-none">MINDS MYG</p>
          </div>
      </div>
      <div class="flex gap-1.5 shrink-0 pl-2 border-l border-zinc-200 dark:border-zinc-700">
          <button onclick="AppCore.toggleTheme()" class="p-1.5 rounded-lg text-zinc-500 dark:text-zinc-400 hover:text-zinc-900 dark:hover:text-white transition focus:outline-none flex items-center justify-center" title="Toggle Theme"><span class="text-sm md:text-base leading-none">🌗</span></button>
      </div>
    </div>
  </nav>
</header>

<main class="flex-1 flex flex-col p-4 w-full max-w-lg mx-auto pb-20 relative">
  
  <!-- Landing View -->
  <div id="viewLanding" class="mt-8 space-y-5 w-full animate-slide-up">
      <div class="text-center mb-6">
          <h2 class="text-3xl font-extrabold mb-2 text-zinc-900 dark:text-white tracking-tight">Welcome</h2>
          <p class="text-zinc-500 dark:text-zinc-400 font-medium text-sm">Please select an option below.</p>
      </div>
      
      <div id="landingRegBox" class="bg-white dark:bg-zinc-900 p-6 rounded-2xl shadow-xl border border-zinc-200 dark:border-zinc-800 text-center border-t-4 border-t-green-500 hidden-force transition-transform hover:-translate-y-1">
          <div class="w-12 h-12 bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400 rounded-full flex items-center justify-center mx-auto mb-3"><i class="fa-solid fa-user-plus text-xl"></i></div>
          <h3 class="text-xl font-bold mb-1 text-zinc-900 dark:text-white">Join the Trip</h3>
          <p class="text-sm text-zinc-500 dark:text-zinc-400 mb-5">Registration is currently open.</p>
          <button onclick="navToAuth('register')" class="w-full bg-green-600 text-white py-3.5 rounded-xl font-bold text-base hover:bg-green-700 shadow-md transition transform active:scale-95">Register Now</button>
      </div>
      
      <div class="bg-white dark:bg-zinc-900 p-6 rounded-2xl shadow-xl border border-zinc-200 dark:border-zinc-800 text-center border-t-4 border-t-primary transition-transform hover:-translate-y-1">
          <div class="w-12 h-12 bg-blue-100 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 rounded-full flex items-center justify-center mx-auto mb-3"><i class="fa-solid fa-right-to-bracket text-xl"></i></div>
          <h3 class="text-xl font-bold mb-1 text-zinc-900 dark:text-white">Participant Portal</h3>
          <p class="text-sm text-zinc-500 dark:text-zinc-400 mb-5">Already registered? Log in here.</p>
          <button onclick="navToAuth('login')" class="w-full bg-primary text-white py-3.5 rounded-xl font-bold text-base hover:bg-blue-700 shadow-md transition transform active:scale-95">Log In</button>
      </div>
  </div>

  <!-- Registration View -->
  <div id="viewRegister" class="hidden-force mt-4 space-y-4 w-full animate-slide-up">
      <div class="flex justify-between items-center pb-4 mb-2">
          <div>
              <h3 class="text-2xl font-black text-zinc-900 dark:text-white tracking-tight">Registration</h3>
              <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-1 font-medium">Person 1 is the Main POC.</p>
          </div>
          <button onclick="navToAuth('landing')" class="text-sm font-bold text-zinc-600 dark:text-zinc-300 bg-zinc-100 dark:bg-zinc-800 px-4 py-2 rounded-xl hover:bg-zinc-200 dark:hover:bg-zinc-700 transition shadow-sm">Cancel</button>
      </div>
      <form id="regForm" onsubmit="event.preventDefault(); submitRegistration(this.querySelector('button[type=submit]'));" class="space-y-6">
          <div id="membersContainer" class="space-y-6"></div>
          <button type="button" onclick="addRegMember()" class="w-full bg-blue-50 dark:bg-zinc-800 text-primary dark:text-blue-400 font-bold py-4 rounded-2xl border-2 border-primary/30 dark:border-blue-500/30 border-dashed hover:bg-blue-100 dark:hover:bg-zinc-700 transition shadow-sm"><i class="fa-solid fa-plus mr-2"></i> Add Group Member</button>
          <div class="pt-4 border-t border-zinc-200 dark:border-zinc-800">
              <button type="submit" class="w-full bg-green-600 text-white font-bold text-lg py-4 rounded-2xl hover:bg-green-700 flex justify-center items-center shadow-xl transition transform active:scale-95">
                  <span class="btn-text">Submit Registration</span><div class="btn-spinner spinner-white hidden-force ml-2 border-2 !w-5 !h-5"></div>
              </button>
          </div>
      </form>
  </div>

  <!-- Login View -->
  <div id="viewLogin" class="hidden-force mt-10 bg-white dark:bg-zinc-900 p-8 rounded-2xl shadow-xl border border-zinc-200 dark:border-zinc-800 w-full animate-slide-up">
      <div class="flex justify-between items-center mb-6 border-b border-zinc-100 dark:border-zinc-800 pb-4">
          <h2 class="text-2xl font-black text-zinc-900 dark:text-white tracking-tight">Secure Login</h2>
          <button onclick="navToAuth('landing')" class="text-sm font-bold text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-300 transition focus:outline-none">Cancel</button>
      </div>
      <div id="loginError" class="bg-red-50 text-red-600 dark:bg-red-900/30 dark:text-red-400 p-3 rounded-lg text-sm mb-4 font-bold hidden-force border border-red-200 dark:border-red-800 text-center"></div>
      
      <div class="mb-5">
          <label class="block text-xs font-bold mb-1.5 text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">Full NRIC / FIN</label>
          <input type="text" id="loginNric" class="w-full p-3.5 border border-zinc-300 dark:border-zinc-700 rounded-xl uppercase font-bold text-zinc-900 dark:text-white bg-zinc-50 dark:bg-black focus:border-primary focus:ring-1 focus:ring-primary transition outline-none shadow-sm" placeholder="S1234567A" onkeypress="handleEnter(event, () => attemptLogin(document.getElementById('loginSubmitBtn')))">
      </div>
      
      <div class="mb-8 relative">
          <label class="block text-xs font-bold mb-1.5 text-zinc-500 dark:text-zinc-400 uppercase tracking-wider">Password</label>
          <input type="password" id="loginPass" class="w-full p-3.5 border border-zinc-300 dark:border-zinc-700 rounded-xl pr-12 font-bold text-zinc-900 dark:text-white bg-zinc-50 dark:bg-black focus:border-primary focus:ring-1 focus:ring-primary transition outline-none shadow-sm" placeholder="••••••••" onkeypress="handleEnter(event, () => attemptLogin(document.getElementById('loginSubmitBtn')))">
          <button type="button" onclick="togglePassword('loginPass')" class="absolute right-3 top-[32px] p-2 text-zinc-400 hover:text-primary transition focus:outline-none">
              <i id="eyeOpen" class="fa-regular fa-eye text-lg"></i>
              <i id="eyeClosed" class="fa-regular fa-eye-slash text-lg hidden-force"></i>
          </button>
      </div>
      
      <button id="loginSubmitBtn" onclick="attemptLogin(this)" class="w-full bg-primary text-white py-3.5 rounded-xl font-bold text-lg hover:bg-blue-700 transition flex justify-center items-center shadow-lg focus:outline-none transform active:scale-95">
          <span class="btn-text">Login</span><div class="btn-spinner spinner-white hidden-force ml-2 border-2 !w-5 !h-5"></div>
      </button>
  </div>
</main>

<script src="backend/config.js"></script>
<script src="frontend/js/core.js"></script>
<script src="frontend/js/auth.js"></script>
<script src="frontend/js/registration.js"></script>
<script src="frontend/js/ui.js"></script>
<script src="frontend/js/rolodex.js"></script>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  if (AppCore.currentUser) {
      window.location.href = './dashboard.html';
      return;
  }
  
  try {
      if (!AppCore.appSettings) {
          const config = await AppCore.apiFetch('getSettings');
          AppCore.appSettings = config;
          localStorage.setItem('appSettings', JSON.stringify(config));
      }
      const regBox = document.getElementById('landingRegBox');
      if (AppCore.appSettings && AppCore.appSettings.registrationOpen) {
          regBox.classList.remove('hidden-force');
      }
  } catch(e) { console.error("Failed to load settings on landing."); }
});
</script>
</body>
</html>
